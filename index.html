<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TXT</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="./css/index.css">
    <script src="./js/http_cdn.jsdelivr.net_npm_vue@2_dist_vue.js"></script>
</head>
<body>
<div id="app">
    <div class="title">
        <h1>备忘录</h1>
    </div>
    <div class="txt_div">
        <label>
            <textarea v-model="txt" @input="changeTXT" class="txt_input"></textarea>
        </label>
    </div>

    <!-- 音乐按钮 + 歌名 -->
    <div class="music-wrap">
        <button id="music-btn" @click="toggleMusic" :class="{ playing: isPlaying }">
            <!-- 播放中: 线条音符 -->
            <svg v-if="isPlaying" viewBox="0 0 24 24" width="22" height="22"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
            </svg>
            <!-- 暂停: 线条音符 + 斜杠 -->
            <svg v-else viewBox="0 0 24 24" width="22" height="22"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
                <line x1="4" y1="4" x2="20" y2="20"/>
            </svg>
        </button>

        <!-- 歌名: 在音符下边 -->
        <div class="song-name" :class="{ paused: !isPlaying }">
            {{ getSongName(playlist[curIndex]) }}
        </div>
    </div>
</div>
</body>

<script>
    const app = new Vue({
        el: '#app',
        data() {
            return {
                txt: '',
                isPlaying: false,
                bgm: null,
                // 歌单
                playlist: [
                    './bgm/赐我.mp3',
                    './bgm/不悟.mp3',
                    './bgm/不坠.mp3'
                ],
                curIndex: 0
            }
        },
        created() {
            this.init()
            this.bgm = new Audio(this.playlist[this.curIndex])
            this.bgm.loop = false
            this.bgm.addEventListener('ended', this.playNext)
            // 注册键盘监听
            window.addEventListener('keydown', this.handleKeydown)
            // 关闭 or 刷新页面的监听
            window.addEventListener('beforeunload', this.handleBeforeUnload)
        },
        // 移除监听
        beforeDestroy() {
            window.removeEventListener('keydown', this.handleKeydown)
            window.removeEventListener('beforeunload', this.handleBeforeUnload)
        },
        methods: {
            init() {
                this.txt = localStorage.getItem('txt') || ''
                this.curIndex = localStorage.getItem('curIndex') || 0
            },
            changeTXT() {
                localStorage.setItem('txt', this.txt)
            },
            // 开始 | 暂停播放
            toggleMusic() {
                if (!this.bgm) return
                if (!this.isPlaying) {
                    this.bgm.play().then(() => {
                        this.isPlaying = true
                        console.log('正在播放: ' + this.getSongName(this.playlist[this.curIndex]) + '...')
                    }).catch(err => {
                        console.warn('音乐播放失败: ', err)
                        this.isPlaying = false
                    })
                } else {
                    this.bgm.pause()
                    this.isPlaying = false
                }
            },
            // 切下一首
            playNext() {
                this.curIndex = (this.curIndex + 1) % this.playlist.length
                // TODO bgm: { src: '' } 是对象
                this.bgm.src = this.playlist[this.curIndex]
                this.bgm.play().then(() => {
                    this.isPlaying = true
                    console.log('正在播放: ' + this.getSongName(this.playlist[this.curIndex]) + '...')
                }).catch(err => {
                    console.warn('切歌失败: ', err)
                    this.isPlaying = false
                })
            },
            // 键盘事件处理
            handleKeydown(e) {
                // Ctrl + Alt + S 开始 | 暂停播放
                if (e.ctrlKey && e.altKey && (e.key === 's' || e.key === 'S')) {
                    e.preventDefault()
                    this.toggleMusic()
                }
                // Ctrl + Alt + N 切下一首
                if (e.ctrlKey && e.altKey && (e.key === 'n' || e.key === 'N')) {
                    e.preventDefault()
                    this.playNext()
                }
            },
            // 关闭 or 刷新页面, 缓存当前播放歌曲索引
            handleBeforeUnload() {
                if (this.bgm) {
                    this.bgm.pause()
                    this.bgm.removeEventListener('ended', this.playNext)
                    this.bgm = null
                }
                localStorage.setItem('curIndex', this.curIndex)
            },
            // 提取歌名
            getSongName(src) {
                return src.match(/([^/]+)\.\w+$/)[1]
            }
        }
    });
</script>
</html>
